<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reflection — Offline</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    background: linear-gradient(160deg, #0b1220 0%, #16202f 45%, #1c2436 75%, #241d2c 100%);
    color: #f1ede9;
  }
  .card {
    max-width: 380px; text-align: center;
    background: rgba(30, 41, 59, 0.65); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px; padding: 36px 28px;
  }
  h1 { font-size: 22px; color: #E5C1B5; margin: 0 0 10px; }
  p { font-size: 14px; line-height: 1.6; color: rgba(229,231,235,0.75); margin: 0 0 20px; }
  button {
    background: linear-gradient(135deg, #C29B8C 0%, #8E6A5E 100%); border: none; color: #fff;
    padding: 11px 24px; font-size: 14px; border-radius: 10px; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Kamu Sedang Offline</h1>
    <p>
      Sepertinya koneksi internet kamu terputus. Refleksi yang sudah tersimpan tetap aman —
      coba sambungkan kembali ke internet lalu muat ulang halaman ini.
      <br /><br />
      <em>You're offline. Your saved reflections are safe — reconnect and reload to continue.</em>
    </p>
    <button onclick="window.location.reload()">Coba Lagi / Try Again</button>
  </div>
</body>
</html>
